services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bursar
      POSTGRES_PASSWORD: bursar
      POSTGRES_DB: bursarbuddy
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bursar -d bursarbuddy"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: "postgres://bursar:bursar@db:5432/bursarbuddy"
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  ai:
    build: ./ai
    environment:
      DATABASE_URL: "postgres://bursar:bursar@db:5432/bursarbuddy"
      MODEL_API_BASE: "https://api.openai.com/v1"
      MODEL_API_KEY: "sk-local-dev-not-a-real-key"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
